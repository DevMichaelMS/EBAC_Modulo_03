<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formuláriio</title>
</head>
<body>
    <header>
        <h1>Formulário</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="containers.html">Containers</a>
            <a href="listas.html">Listas</a>
            <a href="tabelas.html">Tabelas</a>
        </nav>
    </header>
    <hr>
    <h2>Entre em contato!</h2>
    <form action="">
        <label for="nome">Nome:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome">
        <br>
        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Digite seu email">
        <br>
        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha">
        <br>
        <label for="data">Data de Nascimento:</label>
        <input type="date" name="data" id="data">
        <br>
        <label for="tel" >Telefone:</label>
        <input type="tel" name="tel" id="tel" placeholder="Digite seu telefone">
        <br>
        <label for="genero">Gênero:</label>
        <select name="genero" id="genero">
            <option value="masculino">Masculino</option>
            <option value="feminino">Feminino</option>
            <option value="outro">Outro</option>
        </select>
        <br>
        <label for="interesses">Interesses:</label>
        <input type="checkbox" name="interesses" id="interesse1" value="esportes">
        <label for="interesse1">Esportes</label>
        <input type="checkbox" name="interesses" id="interesse2" value="música">
        <label for="interesse2">Música</label>
        <input type="checkbox" name="interesses" id="interesse3" value="leitura">
        <label for="interesse3">Leitura</label> 
        <br>
        <label for="newsletter">Deseja receber nossa newsletter?</label>
        <input type="checkbox" name="newsletter" id="newsletter">
        <br>

        <label for="mensagem">Mensagem:</label>
        <textarea name="mensagem" id="mensagem" cols="30" rows="10" placeholder="Digite sua mensagem"></textarea>
        <br>
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
